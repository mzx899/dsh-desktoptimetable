name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Test
        run: make test

      - name: Build app bundle
        run: make app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopTimetable
          path: build/DesktopTimetable.app
